version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pmgis_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Pass@123
      POSTGRES_DB: pmgis_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    driver: local
